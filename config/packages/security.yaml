security:
    enable_authenticator_manager: true
    
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: _username
                password_parameter: _password
                success_handler: App\Security\AuthenticationSuccessHandler
                failure_path: /login
                post_only: true
                use_referer: true
                failure_forward: false
                require_previous_session: true
            logout:
                path: app_logout
                target: /
                invalidate_session: true
                delete_cookies: ['PHPSESSID']
                clear_site_data: 
                    - cookies
                    - storage
                    - executionContexts

    role_hierarchy:
        ROLE_ADMIN:       [ROLE_USER]
        ROLE_PHARMACIEN:  [ROLE_USER]
        ROLE_VENDEUR:     [ROLE_USER]

    access_control:
        # Routes publiques en premier
        - { path: ^/login$, roles: PUBLIC_ACCESS }  # Ajout du $ pour matcher exactement /login
        - { path: ^/$, roles: PUBLIC_ACCESS }       # Page d'accueil
        - { path: ^/css, roles: PUBLIC_ACCESS }     # Assets
        - { path: ^/js, roles: PUBLIC_ACCESS }      # Assets
        - { path: ^/images, roles: PUBLIC_ACCESS }  # Assets
        
        # Routes protégées ensuite
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/pharmacien, roles: ROLE_PHARMACIEN }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/logout, roles: ROLE_USER }
        
        # Règle par défaut en dernier
        - { path: ^/, roles: ROLE_USER }            # Tout le reste nécessite d'être connecté